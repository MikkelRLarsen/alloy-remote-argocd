prometheus:
  configmapReload:
    # Kubernetes expands these Secret-backed environment variables in the args.
    reloadUrl: "http://$(PROMETHEUS_USERNAME):$(PROMETHEUS_PASSWORD)@127.0.0.1:9090/-/reload"
    env:
      - name: PROMETHEUS_USERNAME
        valueFrom:
          secretKeyRef:
            name: prometheus-basic-auth
            key: username
      - name: PROMETHEUS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: prometheus-basic-auth
            key: password

  server:
    extraArgs:
      web.config.file: /etc/prometheus-auth/web.yml
    extraSecretMounts:
      - name: basic-auth
        secretName: prometheus-basic-auth
        mountPath: /etc/prometheus-auth
        readOnly: true
    # HTTP health endpoints now require credentials, too.
    tcpSocketProbeEnabled: true
    retention: "3d"
    retentionSize: "1800MB"
    # extraArgs with a null value is dropped when passed to a subchart.
    extraFlags:
      - web.enable-lifecycle
      - web.enable-remote-write-receiver
    persistentVolume:
      enabled: true
      size: 2Gi
    ingress:
      enabled: false
    service:
      annotations:
        # Generic annotation scrapes do not supply basic auth.
        prometheus.io/scrape: "false"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

  alertmanager:
    enabled: true
    persistence:
      enabled: true
      size: 512Mi
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"

  kube-state-metrics:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  prometheus-pushgateway:
    enabled: false

  # Receiver only, like Dao non-prod.
  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
