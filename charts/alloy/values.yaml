alloy:
  service:
    enabled: true
    type: ClusterIP

  controller:
    type: deployment
    replicas: 1

  crds:
    create: false

  alloy:
    extraEnv:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: alloy-git
            key: token

    configMap:
      content: |
        import.git "server" {
          repository     = "https://github.com/MikkelRLarsen/alloy-remote-configuration.git"
          revision       = "main"
          path           = "alloy-configuration/k8s.alloy"
          pull_frequency = "1m"

          basic_auth {
            username = "MikkelRLarsen"
            password = sys.env("GITHUB_TOKEN")
          }
        }

        server.run "default" {}
