# The outer alloy key configures the Helm dependency.
alloy:
  # Exposes the Alloy UI on port 12345 for kubectl port-forward.
  service:
    enabled: true
    type: ClusterIP

  controller:
    type: deployment
    replicas: 1

  # No monitoring CRDs are needed for this bootstrap.
  crds:
    create: false

  alloy:
    configMap:
      content: |
        import.git "server" {
          repository     = "https://github.com/MikkelRLarsen/alloy-remote-configuration.git"
          revision       = "main"
          path           = "alloy-configuration/k8s.alloy"
          pull_frequency = "5m"

          basic_auth {
            username = "MikkelRLarsen"
            password = "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"
          }
        }

        server.run "default" {}
