# Shared local test credentials: monitoring / minikube-monitoring.
apiVersion: v1
kind: Secret
metadata:
  name: observability-basic-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: monitoring
  password: minikube-monitoring
  # Referenced by chart 4.5.0 even for HTTP, single-tenant destinations.
  tenantId: ""
  ca: ""
  cert: ""
  key: ""
