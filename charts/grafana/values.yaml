grafana:
  admin:
    existingSecret: grafana
    userKey: GRAFANA_ADMIN_USERNAME
    passwordKey: GRAFANA_ADMIN_PASSWORD

  envFromSecret: grafana

  grafana.ini:
    database:
      type: postgres
      host: $__env{POSTGRES_HOSTNAME}:$__env{POSTGRES_PORT}
      name: $__env{POSTGRES_DB}
      user: $__env{POSTGRES_USER}
      password: $__env{POSTGRES_PASSWORD}
      ssl_mode: disable

    annotations.alert:
      max_age: 90d

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://prometheus-server.prometheus
          basicAuth: true
          basicAuthUser: $PROMETHEUS_USERNAME
          secureJsonData:
            basicAuthPassword: $PROMETHEUS_PASSWORD
          access: proxy
          isDefault: true

        - name: Loki
          uid: loki
          type: loki
          url: http://loki-gateway.loki
          basicAuth: true
          basicAuthUser: $LOKI_USERNAME
          secureJsonData:
            basicAuthPassword: $LOKI_PASSWORD
          access: proxy

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Hardcoded for local minikube; replaces the company ExternalSecret.
envSecret:
  secretName: grafana
  values:
    PROMETHEUS_USERNAME: monitoring
    PROMETHEUS_PASSWORD: minikube-monitoring
    LOKI_USERNAME: monitoring
    LOKI_PASSWORD: minikube-monitoring
    POSTGRES_DB: grafana
    POSTGRES_USER: grafana
    POSTGRES_PASSWORD: minikube-postgres
    POSTGRES_HOSTNAME: grafana-postgres
    POSTGRES_PORT: "5432"
    GRAFANA_ADMIN_USERNAME: admin
    GRAFANA_ADMIN_PASSWORD: minikube-admin

postgres:
  enabled: true
  image: postgres:17.10

  persistence:
    storageClass: ""
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
