apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.envSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: env
type: Opaque
stringData:
  {{- range $k, $v := .Values.envSecret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
